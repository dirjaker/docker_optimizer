<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Optimizer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--accent:#58a6ff;--text:#c9d1d9;--muted:#8b949e;--green:#3fb950;--red:#f85149;--orange:#d29922;--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:600;color:var(--accent)}
.header .sub{font-size:13px;color:var(--muted)}
.container{max-width:1200px;margin:0 auto;padding:24px 32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .value{font-size:36px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:13px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
textarea{width:100%;min-height:250px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'SF Mono','Fira Code',monospace;font-size:13px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.btn{padding:10px 24px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-green{background:var(--green);color:#fff}
.issue{padding:12px;border-radius:6px;margin-bottom:8px;border-left:4px solid}
.issue-warning{background:rgba(210,153,34,.08);border-color:var(--orange)}
.issue-critical{background:rgba(248,81,73,.08);border-color:var(--red)}
.issue-info{background:rgba(88,166,255,.08);border-color:var(--accent)}
.issue .issue-title{font-weight:600;font-size:14px}
.issue .issue-desc{font-size:13px;color:var(--muted);margin-top:4px}
.issue .issue-suggestion{font-size:12px;color:var(--green);margin-top:4px}
.suggestion{padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.suggestion .sug-title{font-weight:600;font-size:14px;color:var(--accent)}
.suggestion .sug-desc{font-size:13px;color:var(--muted);margin-top:4px}
.suggestion .sug-savings{font-size:12px;color:var(--green);margin-top:4px}
.suggestion .sug-example{margin-top:8px}
.suggestion pre{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px;font-size:12px;overflow-x:auto;margin-top:4px}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:13px;max-height:400px;overflow:auto;white-space:pre-wrap}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-warning{background:rgba(210,153,34,.15);color:var(--orange)}
.badge-info{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-critical{background:rgba(248,81,73,.15);color:var(--red)}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 16px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#results{display:none}
</style>
</head>
<body>

<div class="header">
  <div><h1>Docker Optimizer</h1><div class="sub">Analyze and optimize Dockerfile for smaller, faster images</div></div>
</div>

<div class="container">
  <div class="card">
    <h2>Dockerfile Input</h2>
    <textarea id="dockerfileInput" placeholder="Paste your Dockerfile content here...">FROM python:3.11
WORKDIR /app
COPY . .
RUN apt-get update
RUN apt-get install -y curl
RUN pip install -r requirements.txt
EXPOSE 8000
CMD ["python", "app.py"]</textarea>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button class="btn btn-primary" onclick="analyzeDockerfile()" id="analyzeBtn">Analyze</button>
      <select id="formatSelect" style="padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <option value="json">JSON</option>
        <option value="markdown">Markdown Report</option>
        <option value="html">HTML Report</option>
      </select>
    </div>
  </div>

  <div id="results">
    <div class="stats" id="statsGrid">
      <div class="stat-card"><div class="value" id="statBase">--</div><div class="label">Base Image</div></div>
      <div class="stat-card"><div class="value" id="statLayers">0</div><div class="label">Layers</div></div>
      <div class="stat-card"><div class="value" id="statSize">--</div><div class="label">Est. Size (MB)</div></div>
      <div class="stat-card"><div class="value" id="statIssues">0</div><div class="label">Issues Found</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Issues Detected</h2>
        <div id="issuesList"></div>
      </div>

      <div class="card">
        <h2>Optimization Suggestions</h2>
        <div id="suggestionsList"></div>
      </div>
    </div>

    <div class="card">
      <h2>Optimized Dockerfile</h2>
      <div class="tabs">
        <button class="tab active" onclick="showOptimized()">Optimized</button>
        <button class="tab" onclick="showReport()">Report</button>
      </div>
      <div class="preview-box" id="optimizedBox"></div>
    </div>
  </div>
</div>

<script>
const API = '';
let lastResult = null;

async function analyzeDockerfile() {
  const content = document.getElementById('dockerfileInput').value.trim();
  if (!content) return alert('Please paste Dockerfile content');

  const btn = document.getElementById('analyzeBtn');
  btn.innerHTML = '<span class="spinner"></span> Analyzing...';
  btn.disabled = true;

  try {
    const r = await fetch(API + '/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        dockerfile_content: content,
        format: document.getElementById('formatSelect').value,
      })
    });

    if (!r.ok) {
      const err = await r.json();
      alert('Error: ' + (err.detail || 'Analysis failed'));
      return;
    }

    lastResult = await r.json();
    renderResults();
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.innerHTML = 'Analyze';
    btn.disabled = false;
  }
}

function renderResults() {
  if (!lastResult) return;
  document.getElementById('results').style.display = 'block';

  // Stats
  document.getElementById('statBase').textContent = lastResult.base_image;
  document.getElementById('statLayers').textContent = lastResult.total_layers;
  document.getElementById('statSize').textContent = lastResult.estimated_size_mb || '--';
  document.getElementById('statIssues').textContent = lastResult.issues.length;

  // Issues
  const issuesDiv = document.getElementById('issuesList');
  if (lastResult.issues.length === 0) {
    issuesDiv.innerHTML = '<div style="color:var(--muted)">No issues found.</div>';
  } else {
    issuesDiv.innerHTML = lastResult.issues.map(i => `
      <div class="issue issue-${i.severity}">
        <div class="issue-title">${i.title} <span class="badge badge-${i.severity}">${i.severity}</span></div>
        <div class="issue-desc">${i.description}</div>
        ${i.suggestion ? `<div class="issue-suggestion">Suggestion: ${i.suggestion}</div>` : ''}
      </div>
    `).join('');
  }

  // Suggestions
  const sugDiv = document.getElementById('suggestionsList');
  if (lastResult.suggestions.length === 0) {
    sugDiv.innerHTML = '<div style="color:var(--muted)">No suggestions.</div>';
  } else {
    sugDiv.innerHTML = lastResult.suggestions.map(s => `
      <div class="suggestion">
        <div class="sug-title">#${s.priority} ${s.title}</div>
        <div class="sug-desc">${s.description}</div>
        ${s.estimated_savings ? `<div class="sug-savings">Estimated savings: ${s.estimated_savings}</div>` : ''}
        ${s.example_before ? `
          <div class="sug-example">
            <div style="font-size:11px;color:var(--red);margin-top:4px">Before:</div>
            <pre>${escapeHtml(s.example_before)}</pre>
            <div style="font-size:11px;color:var(--green);margin-top:4px">After:</div>
            <pre>${escapeHtml(s.example_after)}</pre>
          </div>` : ''}
      </div>
    `).join('');
  }

  // Optimized
  document.getElementById('optimizedBox').textContent = lastResult.optimized_dockerfile;
}

function showOptimized() {
  document.querySelectorAll('.tab')[0].classList.add('active');
  document.querySelectorAll('.tab')[1].classList.remove('active');
  document.getElementById('optimizedBox').textContent = lastResult.optimized_dockerfile;
}

function showReport() {
  document.querySelectorAll('.tab')[0].classList.remove('active');
  document.querySelectorAll('.tab')[1].classList.add('active');
  document.getElementById('optimizedBox').textContent = lastResult.report || 'Select "Markdown Report" or "HTML Report" format and re-analyze to generate a report.';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
